name: Stellar Contracts CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

env:
  STELLAR_NETWORK: testnet
  STELLAR_RPC_URL: https://soroban-testnet.stellar.org
  STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  # Soroban's on-chain contract-size cap (`contract_max_size_bytes`, read live
  # from `stellar network settings`) is 131072 B / 128 KiB. KoraContract's
  # optimized Wasm is currently ~214 KiB and cannot be uploaded to any live
  # network until it is split into smaller contracts. Tracked in:
  # https://github.com/iam-mercy/kora-app/issues/2
  # The size step below reports the gap as a warning; it does not fail the build.
  CONTRACT_MAX_SIZE_BYTES: 131072

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        working-directory: stellar-contracts
        run: cargo audit --deny warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage report
        working-directory: stellar-contracts
        run: cargo tarpaulin --out Xml --timeout 300 --exclude-files tests/* --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./stellar-contracts/coverage/cobertura.xml
          flags: stellar-contracts
          fail_ci_if_error: false

  stellar-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # soroban-sdk 28 emits the contract Wasm only for the wasm32v1-none
          # target; the old wasm32-unknown-unknown target is rejected by the SDK
          # build script on Rust 1.82+.
          targets: wasm32v1-none

      - name: Install Stellar CLI
        # soroban-sdk 28 requires the contract to be built by `stellar contract
        # build` from stellar-cli >= v25.2.0 (it runs the spec-shaking strip and
        # sets SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2). A plain
        # `cargo build` now hard-errors.
        run: cargo install --locked stellar-cli

      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build contract Wasm (spec-shaken)
        working-directory: stellar-contracts
        run: stellar contract build --optimize=false

      - name: Optimize Wasm (wasm-opt -Oz --mvp-features)
        run: |
          RAW=target/wasm32v1-none/release/kora_stellar.wasm
          OPT=target/wasm32v1-none/release/kora_stellar.optimized.wasm
          if [ ! -f "$RAW" ]; then
            echo "No Wasm artifact at $RAW" >&2
            exit 1
          fi
          wasm-opt -Oz --mvp-features "$RAW" -o "$OPT"
          echo "raw:       $(stat -c%s "$RAW") B"
          echo "optimized: $(stat -c%s "$OPT") B"

      - name: Report contract Wasm size
        run: |
          OPT=target/wasm32v1-none/release/kora_stellar.optimized.wasm
          SIZE=$(stat -c%s "$OPT")
          echo "Optimized contract Wasm: ${SIZE} B (on-chain cap: ${CONTRACT_MAX_SIZE_BYTES} B)"
          if [ "$SIZE" -gt "$CONTRACT_MAX_SIZE_BYTES" ]; then
            OVER=$((SIZE - CONTRACT_MAX_SIZE_BYTES))
            echo "::warning title=Contract exceeds on-chain size cap::Optimized Wasm is ${SIZE} B, ${OVER} B over the ${CONTRACT_MAX_SIZE_BYTES} B cap. Not deployable until the contract is split — see https://github.com/iam-mercy/kora-app/issues/2"
          fi

      - name: Upload optimized Wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: kora-stellar-wasm
          path: target/wasm32v1-none/release/kora_stellar.optimized.wasm
          retention-days: 14

      - name: Test Stellar contracts
        working-directory: stellar-contracts
        run: cargo test

  # Deployment to Stellar testnet is disabled: the optimized KoraContract Wasm
  # (~214 KiB) exceeds the network's 128 KiB `contract_max_size_bytes` cap and is
  # rejected on upload with `tx_malformed` / TxSorobanInvalid. Re-enable this job
  # once the contract has been split below the cap.
  # Tracking issue: https://github.com/iam-mercy/kora-app/issues/2
  deploy-testnet:
    if: false
    runs-on: ubuntu-latest
    needs: stellar-contracts
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build and optimize contract Wasm
        working-directory: stellar-contracts
        run: |
          stellar contract build --optimize=false
          wasm-opt -Oz --mvp-features \
            ../target/wasm32v1-none/release/kora_stellar.wasm \
            -o ../target/wasm32v1-none/release/kora_stellar.optimized.wasm

      - name: Generate deployer keypair
        run: |
          stellar keys generate deployer --network testnet
          stellar keys address deployer

      - name: Fund deployer account via Friendbot
        run: |
          DEPLOYER_ADDRESS=$(stellar keys address deployer)
          curl -s "https://friendbot.stellar.org?addr=${DEPLOYER_ADDRESS}" | jq .

      - name: Deploy contract to testnet
        id: deploy
        run: |
          WASM_PATH=target/wasm32v1-none/release/kora_stellar.optimized.wasm
          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM_PATH" \
            --source deployer \
            --network testnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE")
          echo "contract_id=${CONTRACT_ID}" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: ${CONTRACT_ID}"

      - name: Verify deployment via get_contract_version
        run: |
          stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source deployer \
            --network testnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            -- get_contract_version

      - name: Save contract ID artifact
        run: echo "${{ steps.deploy.outputs.contract_id }}" > contract_id.txt

      - name: Upload contract ID artifact
        uses: actions/upload-artifact@v4
        with:
          name: testnet-contract-id
          path: contract_id.txt
          retention-days: 30

      - name: Notify on deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Testnet deployment failed — ${context.sha.slice(0, 7)}`,
              body: `Deployment to Stellar testnet failed for commit ${context.sha}.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure'],
            })
