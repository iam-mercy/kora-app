name: Auto Merge

# A pull request becomes a merge candidate in two situations: a reviewer
# submits or dismisses a review, and a check suite finishes on the head commit.
# Both paths funnel through the same gate, and the gate reads the current review
# state from the API rather than from the event payload — a green check suite on
# its own is not enough to merge.
on:
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]

# The default token is read-only. Only the job that actually merges asks for
# write access, and that job never executes code coming from the pull request.
permissions:
  contents: read

concurrency:
  group: >-
    auto-merge-${{
      github.event.pull_request.number ||
      github.event.check_suite.pull_requests[0].number ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # `check_suite` fires for every check suite in the repository, including
    # suites that are not attached to a pull request. Ignore those.
    if: >-
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'check_suite' && github.event.check_suite.pull_requests[0] != null)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check the merge gate
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const candidate = context.payload.pull_request
              || context.payload.check_suite.pull_requests[0]
            const number = candidate.number

            const skip = (reason) => {
              core.notice(`Not merging #${number}: ${reason}`)
              core.setOutput('merge', 'false')
            }

            const { data: pull } = await github.rest.pulls.get({
              owner, repo, pull_number: number,
            })

            if (pull.state !== 'open') return skip('the pull request is not open')
            if (pull.draft) return skip('the pull request is still a draft')
            if (pull.head.repo.full_name !== `${owner}/${repo}`) {
              return skip('the head branch lives in a fork')
            }

            const labels = pull.labels.map((label) => label.name)
            if (!labels.includes('automerge')) return skip('the `automerge` label is missing')
            if (labels.includes('work-in-progress')) {
              return skip('the `work-in-progress` label is present')
            }

            // Reviews come back oldest first. Only the latest review from each
            // author describes the current state, so an APPROVED that was later
            // superseded by CHANGES_REQUESTED or a dismissal does not count.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: number, per_page: 100,
            })
            const byAuthor = new Map()
            for (const review of reviews) {
              if (review.state === 'COMMENTED' || review.state === 'PENDING') continue
              byAuthor.set(review.user.login, review.state)
            }
            const states = [...byAuthor.values()]
            const approvals = states.filter((state) => state === 'APPROVED').length
            const blocked = states.filter((state) => state === 'CHANGES_REQUESTED').length
            if (approvals === 0) return skip('no reviewer has approved the pull request')
            if (blocked > 0) return skip(`${blocked} reviewer(s) requested changes`)

            // Let GitHub decide whether the checks are satisfied: the mergeable
            // state is `clean` only when the branch is up to date and every
            // required check has passed. It is computed asynchronously, so poll
            // briefly instead of treating `unknown` as a verdict.
            let state = pull.mergeable_state
            for (let attempt = 0; attempt < 10 && state === 'unknown'; attempt++) {
              await new Promise((resolve) => setTimeout(resolve, 6000))
              const { data } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              })
              state = data.mergeable_state
            }
            if (state !== 'clean') return skip(`the mergeable state is "${state}", not "clean"`)

            core.notice(`#${number}: ${approvals} approval(s), no changes requested, mergeable state clean`)
            core.setOutput('number', String(number))
            core.setOutput('merge', 'true')

      - name: Merge the pull request
        if: steps.gate.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.gate.outputs.number }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
