name: Celo Contracts CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: celo-contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: celo-contracts/package-lock.json

      # Audit policy (see celo-contracts/README.md):
      # - Production dependencies must have no high/critical advisories.
      # - Development dependencies must have no critical advisories.
      # - Accepted advisories are listed in celo-contracts/audit-allowlist.json
      #   with a justification and are filtered out before the gate fails.
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --json > audit-prod.json || true
          node scripts/audit-gate.js audit-prod.json prod

      - name: Audit development dependencies
        run: |
          npm audit --audit-level=critical --json > audit-dev.json || true
          node scripts/audit-gate.js audit-dev.json dev

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celo-audit-reports
          path: |
            celo-contracts/audit-prod.json
            celo-contracts/audit-dev.json

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: celo-contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: celo-contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint contracts
        run: npm run lint

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

      - name: Deploy dry run on local network
        run: npx hardhat run scripts/deploy.js --network hardhat
