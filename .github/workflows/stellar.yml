name: Kora App Stellar Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # soroban-sdk 28 builds the contract for wasm32v1-none only, and the
          # build must go through `stellar contract build` (>= v25.2.0) so the
          # spec-shaking strip runs — a plain `cargo build` now hard-errors.
          target: wasm32v1-none
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli
      - name: Build contracts
        run: |
          cd stellar-contracts
          stellar contract build --optimize=false

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: |
          cd stellar-contracts
          cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: |
          cd stellar-contracts
          cargo clippy -- -D warnings
  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run tests
        run: |
          cd stellar-contracts
          cargo test
      - name: Generate coverage
        run: |
          cd stellar-contracts
          cargo install cargo-tarpaulin
          cargo tarpaulin --out xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./stellar-contracts/cobertura.xml
  
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Security audit
        run: |
          cargo install cargo-audit
          cd stellar-contracts
          cargo generate-lockfile
          cargo audit
