[package]
name = "kora-stellar"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/iam-mercy/kora-app"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Protocol 28 is live on testnet/mainnet; 28.0.0-rc.1 is the only published SDK
# that stamps a protocol-28 `contractenvmetav0` section, which the network now
# requires on upload (a protocol-27 SDK build is rejected with txSOROBAN_INVALID).
# Pinned exactly until soroban-sdk 28.0.0 stable ships.
soroban-sdk = "=28.0.0-rc.1"

[dev-dependencies]
soroban-sdk = { version = "=28.0.0-rc.1", features = ["testutils"] }
proptest = "1.4.0"

# NOTE: Cargo only honours [profile.*] tables from the workspace root, so the
# build profiles for this crate live in ../Cargo.toml. `stellar contract build`
# (stellar-cli v25.2.0+, required by soroban-sdk 28) hard-errors if
# `overflow-checks` is not set on the release profile, which is why the move
# matters and is not just cosmetic.
